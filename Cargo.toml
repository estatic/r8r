[package]
name = "r8r"
version = "0.1.0"
edition = "2021"

[lib]
name = "r8r"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
jsonwebtoken = "9"
async-trait = "0.1"
thiserror = "1"
tiktoken-rs = "0.6"
anyhow = "1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rquickjs = "0.6"
tokio-cron-scheduler = "0.10"
dotenvy = "0.15"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = { version = "8", features = ["mime-guess"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"
wiremock = "0.6"
tokio-tungstenite = "0.24"
futures-util = "0.3"
cucumber = "0.23"
tempfile = "3"
aes = "0.8"
md-5 = "0.10"
cbc = "0.1"

# BDD conformance suite (cucumber). Runs the r8r binary black-box as a CLI and
# as a server; see tests/bdd/README.md. `cargo test --test bdd`.
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false
